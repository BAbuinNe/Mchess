name: MChess quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mchess-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Configure browser executable
        run: node --input-type=module -e 'import { chromium } from "playwright"; console.log("MCHESS_BROWSER=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Build workspaces
        run: npm run build
      - name: Run end-to-end scenarios
        shell: bash
        run: |
          for test_file in tests/*.e2e.mjs; do
            echo "Running $test_file"
            node "$test_file"
          done
